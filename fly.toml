# kitbox on Fly.io — one Machine, one volume, nothing public.
#
#   fly apps create <your-app-name>          # app names are globally unique
#   fly volumes create kitbox_data --size 5 --region <region>
#   fly secrets set TS_AUTHKEY=tskey-auth-…
#   fly deploy --ha=false
#
# Change `app` and `primary_region` below. Everything else is deliberate.

app = "kitbox"
primary_region = "iad"

# The published multi-arch image, so Fly pulls rather than builds. Building the
# image on a remote builder would work too, but it is minutes of apt and npm for
# a result that is already sitting in the registry.
[build]
  image = "ghcr.io/tienan92it/kitbox:latest"

[env]
  # One volume is all a Fly Machine can mount, so gather every path that must
  # outlive a deploy into it.
  STATE_DIR = "/data"
  TS_HOSTNAME = "kitbox"
  TZ = "UTC"
  # Uncomment for client work: a leaked token can then watch but not type.
  # AGENT_CONTROL = "0"

[mounts]
  source = "kitbox_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# There is deliberately no [http_service] or [[services]] block.
#
# In Tailscale mode kitbox needs no inbound networking: it dials out and
# `tailscale serve` puts the terminal on your tailnet. Declaring no service
# keeps the Machine off Fly Proxy entirely, and per Fly's docs, "requests to
# apps without services configured on your private network don't get routed
# through Fly Proxy and so Machines can't be automatically stopped or started
# by Fly Proxy."
#
# That is what guarantees the box never sleeps. `fly launch` would have written
# auto_stop_machines = "stop" into a service block here; adding one back
# reintroduces the idle-stop behaviour this file exists to avoid.
