# A box that outlives your laptop.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d && docker compose logs
#
# The named volumes are not incidental. Without them a restart registers a new
# tailnet node (so the hostname drifts kitbox → kitbox-2 → -3 and your
# bookmark breaks), mints a new token, and logs the agent out.
services:
  kitbox:
    image: ${KITBOX_IMAGE:-ghcr.io/tienan92it/kitbox:latest}
    build:
      context: .
      args:
        AGENTS: ${AGENTS:-claude}
        KITTERM_VERSION: ${KITTERM_VERSION:-v0.15.1}
    container_name: ${TS_HOSTNAME:-kitbox}
    restart: unless-stopped
    env_file: .env
    environment:
      # Only used by the message the box prints in local mode, so the URL it
      # shows matches the port you actually published.
      PUBLISHED_PORT: ${PUBLISHED_PORT:-4990}
    ports:
      # Local mode only. With TS_AUTHKEY set the daemon binds loopback inside
      # the container, so this forwards to a closed port — but it still opens
      # the port on a public host for nothing, and blanking TS_AUTHKEY later
      # would turn it into a shell on the internet behind a single token.
      #
      # To close it, write `ports: []` or comment out BOTH lines. Commenting
      # out only the entry below leaves the key null, and compose refuses to
      # start: "services.kitbox.ports must be a list".
      - "${PUBLISHED_PORT:-4990}:3418"
    # The healthcheck lives in the image (see Dockerfile), so `docker run` and
    # compose report the same thing: whether the daemon is serving, not merely
    # whether the container is up.
    volumes:
      - tailscale:/var/lib/tailscale   # node identity: keeps the hostname stable
      - kitterm:/home/vscode/.kitterm  # tokens: keeps bookmarked links working
      - claude:/home/vscode/.claude    # agent auth: survives restarts
      - codex:/home/vscode/.codex      # same, for AGENTS=codex
      - workspace:/workspace
      # Your code instead of a volume:
      # - /path/to/your/repo:/workspace

volumes:
  tailscale:
  kitterm:
  claude:
  codex:
  workspace:
