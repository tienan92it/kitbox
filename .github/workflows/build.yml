name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  # Weekly, for base-image security updates and newer agent CLIs, which install
  # at @latest. It cannot pick up a newer kitterm — that is pinned on purpose,
  # so a rebuild of the same commit produces the same daemon. check-kitterm
  # below is what tells you the pin has fallen behind.
  schedule:
    - cron: "0 6 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # The pin is deliberate, so nothing here bumps it automatically — a build that
  # silently changes the daemon underneath you is worse than one that is a week
  # behind. This just makes falling behind visible: a red weekly run instead of
  # a rebuild that was never capable of noticing. It is a separate job, so the
  # image still publishes when the pin is stale.
  check-kitterm:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's/^ARG KITTERM_VERSION=//p' Dockerfile)
          latest=$(gh release view -R tienan92it/kitterm --json tagName -q .tagName)
          echo "pinned: $pinned    latest: $latest"
          [ "$pinned" = "$latest" ] && exit 0
          echo "::error::kitbox pins kitterm $pinned but $latest has shipped. Bump Dockerfile, docker-compose.yml and .github/workflows/build.yml, then verify a build before releasing."
          exit 1

  # The version sat at 0.1.0 through five changes to the CLI, so a user could not
  # tell an old install from a current one. This makes that state impossible to
  # push: change bin/kitbox, change VERSION.
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "no parent commit; nothing to compare"
            exit 0
          fi
          if git diff --quiet HEAD~1 HEAD -- bin/kitbox; then
            echo "bin/kitbox unchanged"
            exit 0
          fi
          now=$(sed -n 's/^VERSION=//p' bin/kitbox)
          was=$(git show HEAD~1:bin/kitbox 2>/dev/null | sed -n 's/^VERSION=//p')
          echo "VERSION was '${was:-none}', now '$now'"
          if [ "$was" != "$now" ]; then
            exit 0
          fi
          echo "::error::bin/kitbox changed but VERSION is still $now. Bump VERSION, so install.sh can report the upgrade and a user can tell which build they have."
          exit 1

  # One job per architecture on a native runner. Emulating a Swift-era image
  # under QEMU turns a three-minute build into half an hour, and the tarball is
  # prebuilt anyway, so there is nothing to gain from it.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            AGENTS=${{ vars.AGENTS || 'claude,codex' }}
            KITTERM_VERSION=${{ vars.KITTERM_VERSION || 'v0.17.0' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The bare hash, not the full `sha256:…` reference: upload-artifact
      # refuses a colon in a filename, and the merge job below prepends the
      # prefix again when it rebuilds the reference.
      # env, not inline ${{ }}, keeps the value out of shell parsing.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  # Both architectures under one tag, so `docker run` picks the right one.
  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
